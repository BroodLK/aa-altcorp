name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' aa_altcorp/__init__.py)
          if [[ -z "$current" ]]; then
            echo "Could not read __version__ from aa_altcorp/__init__.py" >&2
            exit 1
          fi

          previous=""
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            previous=$(git show "$BEFORE_SHA:aa_altcorp/__init__.py" 2>/dev/null \
              | sed -nE 's/^__version__ = "([^"]+)"$/\1/p' || true)
          fi

          if [[ "$current" == "$previous" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; refusing to replace it." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $VERSION"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag"
