name: Automated checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# A push to a branch with an open pull request would otherwise run this twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  pytest:
    # The plugin test suite, run under tests.settings where Alliance Auth is
    # deliberately absent. This is the bulk of the suite, including every alert
    # engine test, so it runs across the whole supported Python range.
    name: Pytest (Python ${{ matrix.python-version }})
    needs: pre-commit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  tests:
    # The Alliance Auth integration suite. Installs and migrates the full Auth
    # app set, so it runs on one interpreter rather than the whole matrix.
    name: Alliance Auth integration tests
    needs: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip tox tox-gh-actions
      - run: tox -e py312
