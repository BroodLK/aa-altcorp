[tox]
requires = tox>=4.2
env_list = py{312,311,310}

[testenv]
# Exact pins here on purpose: the installed dependencies declare ranges so the
# plugin can sit in any compatible Alliance Auth deployment, while this env
# tests one known-good combination.
package = skip
deps =
    allianceauth==5.3.0
    django-esi==10.0.0
    django-sri==0.8.0
    croniter==6.2.4
    django-celery-beat==2.9.0
    django-ninja~=1.4
    httpx
    coverage
    django-webtest
    fakeredis
    pytest
    pytest-django
    pytest-cov
commands_pre =
    pip install --no-deps aa-contacts==1.0.1
    pip install --no-deps -e .
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
commands =
    coverage run runtests.py aa_altcorp -v 2
    coverage report
    coverage xml

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
