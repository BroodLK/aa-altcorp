[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allianceauth-altcorp"
description = "Alliance Auth plugin for tracking alt corporation relationships."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dynamic = ["version"]
# Ranges rather than == pins: this is a plugin installed *into* an Alliance Auth
# deployment, and an exact pin would downgrade or refuse to install against any
# other version of the host. The exact versions under test live in tox.ini.
dependencies = ["allianceauth>=5.3,<6", "aa-contacts>=1.0.1,<2", "django-esi>=9,<10", "croniter>=6,<7", "django-celery-beat>=2.7,<3"]

[project.optional-dependencies]
dev = ["allianceauth-discordbot>=5,<6", "coverage", "django-webtest", "fakeredis", "pre-commit", "pytest>=8,<9", "pytest-django>=4.9,<5", "pytest-cov>=5,<7", "ruff>=0.6,<1", "tox>=4.2", "tox-gh-actions"]

[tool.hatch.version]
path = "aa_altcorp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["aa_altcorp"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-config --strict-markers --cov=aa_altcorp --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "BLE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and their fixtures carry obviously-fake credentials.
"tests/*" = ["S101", "S105", "S106"]
"aa_altcorp/tests/*" = ["S101", "S105", "S106"]
# Test-project settings: the key and ESI placeholders are deliberately public.
"testauth/settings/*" = ["S105"]
